name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: current
          fetch-depth: 0

      - name: Build VyOS Disk Image
        run: |
          # 1. VyOS 1.5-д дискний image-ийг 'raw' форматтай гаргадаг.
          # Proxmox 'qm importdisk' команд нь .raw файлыг шууд дэмждэг.
          docker run --rm --privileged -v $(pwd):/vyos -w /vyos vyos/vyos-build:current \
            sudo ./build-vyos-image generic --architecture amd64 --build-type raw

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.5-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.5 Rolling Build ${{ steps.get_version.outputs.VERSION }}
          # Үр дүн 'build/' хавтсанд .raw өргөтгөлтэй үүснэ
          files: build/*.raw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
