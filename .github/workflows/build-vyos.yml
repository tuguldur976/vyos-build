name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: sagitta
          fetch-depth: 0

      - name: Build VyOS QCOW2 Image
        run: |
          # 1. VyOS build контейнерыг ажиллуулж, дотор нь build-vyos-image командыг дуудна
          # Sagitta салбарын багцуудыг ашиглан QCOW2 болон Cloud-Init image үүсгэнэ
          docker run --rm --privileged -v $(pwd):/vyos -w /vyos vyos/vyos-build:sagitta \
            sudo ./build-vyos-image qemu --cloud-init --architecture amd64

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.4-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.4 LTS Build ${{ steps.get_version.outputs.VERSION }}
          files: build/*.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
