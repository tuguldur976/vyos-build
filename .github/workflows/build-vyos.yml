name: Build VyOS 1.5 ISO

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: current # 1.5 Rolling салбар
          fetch-depth: 0

      - name: Build VyOS ISO
        run: |
          # Баримт бичигт заасан 'Docker' командыг шууд ажиллуулах
          # --privileged: Build хийх явцад mount хийх эрх олгоно
          # ./build-vyos-image generic: ISO файл үүсгэх үндсэн команд
          docker run --rm --privileged -v $(pwd):/vyos -w /vyos vyos/vyos-build:current \
            sudo ./build-vyos-image generic \
            --architecture amd64 \
            --custom-package qemu-guest-agent \
            --custom-package cloud-init \
            --custom-package iperf3 \
            --custom-package mtr-tiny \
            --custom-package htop \
            --custom-package tmux \
            --custom-package prometheus-node-exporter

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.5-iso-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.5 Rolling ISO ${{ steps.get_version.outputs.VERSION }}
          # Үр дүн 'build/' хавтсанд .iso өргөтгөлтэй үүснэ
          files: build/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
