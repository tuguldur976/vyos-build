name: Build VyOS ISO

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Сонгосон салбартаа тааруулж солиорой: current эсвэл sagitta
          ref: sagitta 
          fetch-depth: 0

      - name: Cleanup and Free Space
        run: |
          # Өмнөх build-ээс үлдсэн байж болох config болон cache-ийг бүрэн устгах
          sudo git clean -xdf 
          sudo rm -rf /usr/share/dotnet /opt/ghc
          docker image prune -af

      - name: Build VyOS ISO
        run: |
          # --network=host нэмсэнээр DNS алдаа засагдана
          docker run --rm --privileged --network=host \
            -v $(pwd):/vyos \
            -w /vyos \
            vyos/vyos-build:sagitta \
            sudo ./build-vyos-image iso --architecture amd64

      - name: Get Version Number
        if: success()
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-iso-${{ steps.get_version.outputs.VERSION }}
          name: VyOS ISO ${{ steps.get_version.outputs.VERSION }}
          files: build/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
