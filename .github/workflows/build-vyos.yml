name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: current # 1.5 Rolling
          fetch-depth: 0

      - name: Build VyOS Image
        run: |
          # 1. Скриптэд ажиллуулах эрх өгөх
          chmod +x ./build-by-container
          
          # 2. Албан ёсны баримт бичигт зааснаар 'qemu' төрлөөр build хийнэ. 
          # Энэ нь автоматаар Cloud-init дэмжлэгтэй .qcow2 файлыг үүсгэдэг.
          # --flavor cloud-init нь нэмэлт тохиргоог оруулах болно.
          sudo ./build-by-container --type qemu --flavor generic

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.5-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.5 Rolling Build ${{ steps.get_version.outputs.VERSION }}
          # Үр дүн 'build/' хавтсанд .qcow2 өргөтгөлтэй байх болно.
          files: build/*.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
