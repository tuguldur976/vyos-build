name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: current # 1.5 Rolling салбар
          fetch-depth: 0

      - name: Build VyOS Image
        run: |
          # 1. 'generic' бол flavor (амт)
          # 2. '--build-type qemu' бол гаралтын формат
          # Энэ нь Proxmox-т зориулсан .qcow2 файлыг build/ хавтсанд гаргана.
          docker run --rm --privileged -v $(pwd):/vyos -w /vyos vyos/vyos-build:current \
            sudo ./build-vyos-image generic --build-type qemu --architecture amd64

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.5-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.5 Rolling Build ${{ steps.get_version.outputs.VERSION }}
          # build/ хавтсанд үүссэн бүх файлыг (ихэвчлэн .qcow2) оруулна
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
