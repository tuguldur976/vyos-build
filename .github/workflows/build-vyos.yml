name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: current # VyOS 1.5 Rolling салбар
          fetch-depth: 0

      - name: Build VyOS Image
        run: |
          # Баримт бичигт заасан 'build-by-container' скриптийн гүйцэтгэдэг үндсэн команд:
          # --type qemu: Proxmox/KVM-д зориулсан .qcow2 файл үүсгэнэ.
          # generic: Үндсэн flavor буюу багцын төрөл.
          docker run --rm --privileged -v $(pwd):/vyos -w /vyos vyos/vyos-build:current \
            sudo ./build-vyos-image generic --type qemu --architecture amd64

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.5-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.5 Rolling Build ${{ steps.get_version.outputs.VERSION }}
          # Үр дүн 'build/' хавтсанд .qcow2 өргөтгөлтэй үүснэ.
          files: build/*.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
