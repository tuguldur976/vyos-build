name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: current # VyOS 1.5 салбар
          fetch-depth: 0

      - name: Ensure Build Script Exists
        run: |
          # Хэрэв build-by-container файл байхгүй бол албан ёсны сангаас татаж авна
          if [ ! -f "./build-by-container" ]; then
            echo "build-by-container not found, downloading from upstream..."
            curl -O https://raw.githubusercontent.com/vyos/vyos-build/current/build-by-container
          fi
          chmod +x ./build-by-container

      - name: Build VyOS Image
        run: |
          # Албан ёсны баримт бичигт заасан хамгийн зөв команд:
          # --type qemu: Proxmox/KVM-д зориулсан .qcow2 үүсгэнэ
          # --flavor generic: Бүх виртуал орчинд тохиромжтой багцуудыг суулгана
          sudo ./build-by-container --type qemu --flavor generic

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.5-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.5 Rolling Build ${{ steps.get_version.outputs.VERSION }}
          files: build/*.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
