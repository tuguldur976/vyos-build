name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: sagitta
          fetch-depth: 0

      - name: Build VyOS QCOW2 Image
        run: |
          # 1. VyOS 1.4 (Sagitta) дээр 'qemu' flavor нь Cloud-Init-ийг өөртөө агуулдаг.
          # Тиймээс --cloud-init flag-ийг хасаж, шууд 'qemu' төрлөөр build хийнэ.
          docker run --rm --privileged -v $(pwd):/vyos -w /vyos vyos/vyos-build:sagitta \
            sudo ./build-vyos-image qemu --architecture amd64

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.4-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.4 LTS Build ${{ steps.get_version.outputs.VERSION }}
          # Build-ийн үр дүн 'build/' хавтсанд үүсдэг
          files: build/*.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
