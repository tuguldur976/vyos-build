name: Build VyOS 1.4 Sagitta ISO

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: sagitta
          fetch-depth: 0

      - name: Maximize Disk Space & Cleanup
        run: |
          # Өмнөх build-ийн үлдэгдэл болон шаардлагагүй файлуудыг бүрэн цэвэрлэх
          sudo git clean -xdf
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker image prune -af

      - name: Build VyOS ISO
        run: |
          # 1. --network=host : DNS алдааг засна
          # 2. -e VYOS_MIRROR : Репозиторыг гараар зааж өгөх (шаардлагатай бол)
          docker run --rm --privileged --network=host \
            -v $(pwd):/vyos \
            -w /vyos \
            vyos/vyos-build:sagitta \
            sudo ./build-vyos-image iso --architecture amd64

      - name: Get Version Number
        if: success()
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.4-iso-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.4 Sagitta ISO ${{ steps.get_version.outputs.VERSION }}
          files: build/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
