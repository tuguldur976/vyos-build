name: Build VyOS Image

on:
  workflow_dispatch:

jobs:
  build-vyos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: sagitta
          fetch-depth: 0 # Бүх түүхийг татаж авах (найдвартай)

      - name: List files (Debug)
        run: ls -la # Файлууд байгаа эсэхийг терминал дээр харуулна

      - name: Fix Permissions
        run: |
          # Файлыг ажиллуулж болохуйц (executable) болгоно
          if [ -f "./build-by-container" ]; then
            chmod +x ./build-by-container
          else
            echo "Error: build-by-container not found!"
            exit 1
          fi

      - name: Build VyOS Cloud-Init Image
        run: |
          # Тухайн файлыг шууд дуудаж ажиллуулна
          sudo ./build-by-container --type qcow2 --flavor cloud-init

      - name: Get Version Number
        id: get_version
        run: echo "VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vyos-1.4-${{ steps.get_version.outputs.VERSION }}
          name: VyOS 1.4 LTS Build ${{ steps.get_version.outputs.VERSION }}
          files: build/vyos-*.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
